[package]
name = "chatport"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rust-embed = { version = "8.14.0", features = ["mime-guess"] }
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1.14"
serde_json = "1"
similar = "3.2.1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
toml = "0.8"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1", features = ["v7"] }
