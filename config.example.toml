bind = "0.0.0.0:8787"
data_dir = "~/.local/share/chatport"
# Named API keys; pick one per conversation in chat settings.
# --key / env OPENROUTER_API_KEY override the default key (or create one named "default").
# default_key = "personal"   # default: first entry
# [[keys]]
# name = "personal"
# key = "sk-or-..."
# [[keys]]
# name = "work"
# key = "sk-or-..."
default_model = "openrouter/free"

# OpenRouter `provider` routing object, passed through as-is. Per-conversation override via API.
# [default_provider]
# order = ["anthropic"]
# allow_fallbacks = false

# HTTP Basic auth (plain HTTP: keeps casual LAN visitors out, not a sniffer). Off when absent.
# [auth]
# user = "me"
# password = "change-me"
