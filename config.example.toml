bind = "0.0.0.0:8787"
data_dir = "~/.local/share/chatport"
# Named API keys; pick one per conversation in chat settings.
# --keyfile / env OPENROUTER_API_KEY override the default key (or create one named "default").
# default_key = "personal"   # default: first entry
# [[keys]]
# name = "personal"
# key = "sk-or-..."
# [[keys]]
# name = "work"
# key = "sk-or-..."
default_model = "openrouter/free"

# Directory for `@relative/path` attachments in new chats (per-chat in settings).
# `@/abs/path` and `@~/path` work without it.
# default_file_root = "~/notes"

# OpenRouter `provider` routing object, passed through as-is. Per-conversation override via API.
# [default_provider]
# order = ["anthropic"]
# allow_fallbacks = false

# HTTP Basic auth (plain HTTP: keeps casual LAN visitors out, not a sniffer). Off when absent.
# [auth]
# user = "me"
# password = "change-me"

# Batch models (`<slug>:batch`): the server checks pending batches by itself,
# first 5 min after submit, then with doubling gaps up to this interval.
# "0" or "off" disables (⟳ in the UI still works).
# [batch]
# poll_interval = "1h"
